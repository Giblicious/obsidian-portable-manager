name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and manifests
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          FRAMEWORK_VERSION=$(node -p "require('./framework/framework-manifest.json').frameworkVersion")
          test "$GITHUB_REF_NAME" = "$VERSION"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$FRAMEWORK_VERSION"
      - run: npm ci --no-fund
      - run: npm audit --audit-level=high
      - run: npm run check
      - name: Package framework
        shell: powershell
        run: ./scripts/package-framework.ps1
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
            versions.json
            dist/portable-framework.zip
            dist/portable-framework.sha256
